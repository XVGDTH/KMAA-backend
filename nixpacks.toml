[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.openssl",
    "php82Extensions.tokenizer",
    "php82Extensions.xml",
    "php82Extensions.ctype",
    "php82Extensions.json",
    "php82Extensions.bcmath",
    "php82Extensions.fileinfo",
    "php82Extensions.curl",
    "php82Extensions.gd",
    "php82Extensions.zip",
    "php82Extensions.intl",
    "php82Extensions.exif",
    "php82Extensions.sodium",
    "composer"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
    "php artisan config:clear",
    "php artisan route:clear",
    "php artisan view:clear",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && vendor/bin/heroku-php-apache2 public/"