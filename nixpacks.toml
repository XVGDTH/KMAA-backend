[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo_mysql",
    "php84Extensions.mbstring",
    "php84Extensions.openssl",
    "php84Extensions.tokenizer",
    "php84Extensions.xml",
    "php84Extensions.ctype",
    "php84Extensions.json",
    "php84Extensions.bcmath",
    "php84Extensions.fileinfo",
    "php84Extensions.curl",
    "php84Extensions.gd",
    "php84Extensions.zip",
    "php84Extensions.intl",
    "php84Extensions.exif",
    "php84Extensions.sodium",
    "composer"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-intl"
]

[phases.build]
cmds = [
    "php artisan config:clear",
    "php artisan route:clear",
    "php artisan view:clear",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && vendor/bin/heroku-php-apache2 public/"